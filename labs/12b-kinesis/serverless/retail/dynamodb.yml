Resources:
  RetailOrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ${self:custom.retail.tableName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: N
        - AttributeName: line_id
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
        - AttributeName: line_id
          KeyType: RANGE
